# Runs the pipeline whenever the iPhone Shortcut uploads a CSV to incoming/:
# ingest -> dashboard -> reports, then commits the results back to main.
# Commits pushed with GITHUB_TOKEN don't trigger workflows, so this can't loop.
name: Process upload

on:
  push:
    branches: [main]
    paths: ["incoming/*.csv"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-upload
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
        with:
          # latest main, not the triggering commit: runs are queued one at a
          # time, so this includes the previous run's results
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest, rebuild dashboard, write reports
        run: python scripts/update_dashboard.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A incoming reports data dashboard
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Process upload $(date +%Y-%m-%d)"
          # another upload may have landed while this ran
          git pull --rebase
          git push
